# Runs on every pull request and on every push to main:
# 1. checks the content files, 2. runs the backend tests.
# It uses the same commands we run on our own computers.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Security: this workflow can only read the code. It can't push, merge or change anything.
permissions:
  contents: read

# If someone pushes again to the same pull request, stop the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # .env.example holds fake values only, which is all the tests need.
      # No real secret is ever used here.
      - name: Create .env from the example
        run: cp .env.example .env

      # Content files from the content team: units, quizzes, mock tests and proverbs.
      # Quizzes and mock tests are checked against the units, so the checker needs an
      # (empty) database. It never saves anything (everything is rolled back).
      - name: Prepare an empty database for the content check
        run: docker compose run --rm --build backend alembic upgrade head

      - name: Check content files (units, quizzes, mock tests, proverbs)
        run: docker compose run --rm -v "$PWD/data":/data:ro backend python -m app.content.check_all /data

      - name: Run backend tests
        run: docker compose --profile test run --rm --build tests

      - name: Clean up
        if: always()
        run: docker compose --profile test down --volumes
